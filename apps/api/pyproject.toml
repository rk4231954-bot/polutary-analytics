[project]
name = "polutary-api"
version = "0.1.0"
description = "Flask REST API for Polutary Analytics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.0.58",
    "python-dotenv==1.2.4",
    "pandas==3.1.1",
    "pyhive==0.7.0",
    "thrift==0.25.0",
    "thrift-sasl==0.4.3",
    "pure-sasl==0.6.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poultry_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
