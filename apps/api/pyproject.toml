[project]
name = "polutary-api"
version = "0.3.0"
description = "Flask REST API for Polutary Analytics"
readme = "README.md"
# Runs on Python 3.11 and 3.12 (the monorepo default is 3.12, see /.python-version).
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.0.58",
    "python-dotenv==1.2.4",
    "flask-jwt-extended==4.7.4",
    "flask-cors==6.0.5",
    "argon2-cffi==25.1.0",
    # Used from stage 6+ (CSV preprocessing, Hive). Not imported by the stage 3 code.
    "pandas==3.1.1",
    "pyhive==0.7.0",
    "thrift==0.25.0",
    "thrift-sasl==0.4.3",
    "pure-sasl==0.6.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

# The API is an application, not a library: uv installs its dependencies only.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: needs the real Hadoop/Hive services (stage 7+)"]
