[project]
name = "polutary-ml"
version = "0.1.0"
description = "Machine learning training and evaluation for Polutary Analytics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.5",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    "joblib==1.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poultry_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
